[bed_mesh]
#blprobe
#speed: 120
#horizontal_move_z: 6
#eddy
probe_count: 9, 9
speed: 200
horizontal_move_z: 2
mesh_min: 0, 0
#X 210, Y 210 -> hay que restar bl offser x = 210 - 39 | y = 210 - 13 
mesh_max: 169, 197
algorithm: bicubic

# ---------------------

[mcu eddy]
serial: /dev/serial/by-id/usb-Klipper_rp2040_504434031023951C-if00
restart_method: command

[temperature_sensor btt_eddy_mcu]
sensor_type: temperature_mcu # Sets the type of sensor for Klipper to read
sensor_mcu: eddy # Sets the MCU of the eddy probe tempereature sensor
min_temp: 10 # Sets the minimum tempereature for eddys tempereature sensor to operate
max_temp: 100 # Sets the maximum tempereature for eddys tempereature sensor to operate

[probe_eddy_current btt_eddy]
sensor_type: ldc1612
z_offset: 2
#i2c_address:
i2c_mcu: eddy  # This value is good for the Eddy USB but would need to be adjusted for the Eddy Coil according to the MCU you have used.
i2c_bus: i2c0f # This value is good for the Eddy USB but would need to be adjusted for the Eddy Coil according to the I2C bus you have used.
# Measure the offsets below using the method described here: https://www.klipper3d.org/Probe_Calibrate.html#calibrating-probe-x-and-y-offsets
# For a standard Voron stealthburner X carriage mount there should be no need to change the defaults below.
x_offset: -72
y_offset: 0

# This section is only relevant for Eddy USB. Comment it out for Eddy Coil.
[temperature_probe btt_eddy]
sensor_type: Generic 3950
sensor_pin: eddy:gpio26
horizontal_move_z: 2

# ---------------------

#[safe_z_home]
#home_xy_position: 124, 118 # center nozzle
#speed: 200 #75
#z_hop: 15 #move up 10mm
#z_hop_speed: 5
#probe_count: 4, 4

[screws_tilt_adjust]
screw1: 60, 30
screw1_name: fl del. izq 1 
screw2: 230, 30
screw2_name: fr del. der 2
screw3: 230, 197
screw3_name: rr det. der 3
screw4: 60, 197
screw4_name: rl det. izq 4
horizontal_move_z: 10
speed: 250
screw_thread: CW-M3

# ---------------------

[stepper_x]
step_pin: PB13
dir_pin: PB12
enable_pin: !PB14
microsteps: 32
full_steps_per_rotation: 200
rotation_distance: 40
endstop_pin: ^PC0
position_min: 0
position_max: 232
position_endstop: 232
homing_speed: 100
homing_positive_dir: true

[tmc2209 stepper_x]
uart_pin: PC11
tx_pin: PC10
uart_address: 0
run_current: 0.580 # new - may need changing

[stepper_z]
step_pin: PB0
dir_pin: PC5
enable_pin: !PB1
microsteps: 32
full_steps_per_rotation: 200
rotation_distance: 40
endstop_pin: probe:z_virtual_endstop #^PC2
position_min: -6
position_max: 150
homing_speed: 100

[tmc2209 stepper_z]
uart_pin: PC11
tx_pin: PC10
uart_address: 1
run_current: 0.580
interpolate: False

# ---------------------

[stepper_y]
step_pin: PB10
dir_pin: PB2
enable_pin: !PB11
microsteps: 32
full_steps_per_rotation: 200
rotation_distance: 40
endstop_pin: ^PC1
position_endstop: 0
position_max: 213
homing_speed: 100
second_homing_speed: 50

[tmc2209 stepper_y]
uart_pin: PC11
tx_pin: PC10
uart_address: 2
run_current: 0.580
interpolate: False

# ---------------------

[extruder]
step_pin: PB3
dir_pin: !PB4
enable_pin: !PD1
microsteps: 32
#rotation_distance: 33.500 #<- este es anterior de ender3
rotation_distance: 4.637 # LDO-36STH20-1004AHG
max_extrude_only_distance: 500 # LDO-36STH20-1004AHG
max_extrude_only_velocity: 120 # LDO-36STH20-1004AHG
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PC8
sensor_pin: PA0
min_extrude_temp: 9
max_extrude_cross_section: 2
max_extrude_only_distance: 100
