# This file contains common pin mappings for the BIGTREETECH SKR mini
# E3 v3.0. To use this config, the firmware should be compiled for the
# STM32G0B1 with a "8KiB bootloader" and USB communication.

# The "make flash" command does not work on the SKR mini E3. Instead,
# after running "make", copy the generated "out/klipper.bin" file to a
# file named "firmware.bin" on an SD card and then restart the SKR
# mini E3 with that SD card.

# See docs/Config_Reference.md for a description of parameters.

# BED MESH
# X MAX = 232
# Y MAX = 232
# Z MAX = 150(save) 175 LIMIT
#
# X CENTER 169
# Y CENTER 197

[include mainsail.cfg]
[include macros/*.cfg]

#[include host_display_menu.cfg]
#[host_ip]

#[include adxl345.cfg] # Comment this out when you disconnect the accelerometer
[include inputShaper.cfg] # Comment when use adxl345 accelerometer

#Legacy Adaptive Meshing
[include KAMP_Settings.cfg]
#[include Adaptive_Mesh_legacy.cfg]

[include K-ShakeTune/*.cfg]

[exclude_object]

[mcu]
serial: /dev/ttyAMA0
restart_method: command

[printer]
kinematics: corexz
max_velocity: 300
max_accel: 4000
max_z_velocity: 8 #100
max_z_accel: 120 #500 - velocidad de la Z
#square_corner_velocity: 4.0

