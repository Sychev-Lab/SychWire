# This file contains common pin mappings for the BIGTREETECH SKR mini
# E3 v3.0. To use this config, the firmware should be compiled for the
# STM32G0B1 with a "8KiB bootloader" and USB communication.

# The "make flash" command does not work on the SKR mini E3. Instead,
# after running "make", copy the generated "out/klipper.bin" file to a
# file named "firmware.bin" on an SD card and then restart the SKR
# mini E3 with that SD card.

# See docs/Config_Reference.md for a description of parameters.

# BED MESH
# X MAX = 250 232 LIMIT
# Y MAX = 250 213 LIMIT
# Z MAX = 150(save) 175 LIMIT
#
# X CENTER 169
# Y CENTER 197

[include mainsail.cfg]
[include macros/*.cfg]

#[include host_display_menu.cfg]
#[host_ip]

#[include adxl345.cfg] # Comment this out when you disconnect the accelerometer
[include inputShaper.cfg] # Comment when use adxl345 accelerometer

#Legacy Adaptive Meshing
[include KAMP_Settings.cfg]
#[include Adaptive_Mesh_legacy.cfg]

[include K-ShakeTune/*.cfg]

[exclude_object]

[mcu]
serial: /dev/ttyAMA0
restart_method: command

[printer]
kinematics: corexz
max_velocity: 300
max_accel: 4000
max_z_velocity: 8
max_z_accel: 120

# ---------------------

[bed_mesh]
speed: 200
horizontal_move_z: 2
algorithm: bicubic
mesh_min: 20, 10
mesh_max: 189, 190
probe_count: 10, 10
scan_overshoot: 8

# ---------------------

[mcu eddy]
serial: /dev/serial/by-id/usb-Klipper_rp2040_504434031023951C-if00
restart_method: command

[temperature_sensor btt_eddy_mcu]
sensor_type: temperature_mcu # Sets the type of sensor for Klipper to read
sensor_mcu: eddy # Sets the MCU of the eddy probe tempereature sensor
min_temp: 10 # Sets the minimum tempereature for eddys tempereature sensor to operate
max_temp: 100 # Sets the maximum tempereature for eddys tempereature sensor to operate

[probe_eddy_current btt_eddy]
sensor_type: ldc1612
#z_offset: 2
#i2c_address:
i2c_mcu: eddy  # This value is good for the Eddy USB but would need to be adjusted for the Eddy Coil according to the MCU you have used.
i2c_bus: i2c0f # This value is good for the Eddy USB but would need to be adjusted for the Eddy Coil according to the I2C bus you have used.
# Measure the offsets below using the method described here: https://www.klipper3d.org/Probe_Calibrate.html#calibrating-probe-x-and-y-offsets
# For a standard Voron stealthburner X carriage mount there should be no need to change the defaults below.
x_offset: -27
y_offset: 0

# This section is only relevant for Eddy USB. Comment it out for Eddy Coil.
[temperature_probe btt_eddy]
sensor_type: Generic 3950
sensor_pin: eddy:gpio26
horizontal_move_z: 2

# ---------------------

[safe_z_home]
home_xy_position: 124, 118 # center nozzle
z_hop: 10
z_hop_speed: 25
speed: 200

[screws_tilt_adjust]
screw1: 60, 30
screw1_name: fl del. izq 1 
screw2: 230, 30
screw2_name: fr del. der 2
screw3: 230, 197
screw3_name: rr det. der 3
screw4: 60, 197
screw4_name: rl det. izq 4
horizontal_move_z: 10
speed: 250
screw_thread: CW-M3

# ---------------------

[stepper_x]
step_pin: PB13
dir_pin: PB12
enable_pin: !PB14
microsteps: 32
full_steps_per_rotation: 200
rotation_distance: 40
endstop_pin: ^PC0
position_min: 0
position_max: 232
position_endstop: 232
homing_speed: 100
homing_positive_dir: true

[tmc2209 stepper_x]
uart_pin: PC11
tx_pin: PC10
uart_address: 0
run_current: 0.580 # new - may need changing

[stepper_z]
step_pin: PB0
dir_pin: PC5
enable_pin: !PB1
microsteps: 32
full_steps_per_rotation: 200
rotation_distance: 40
endstop_pin: probe:z_virtual_endstop #^PC2
position_min: -6
position_max: 150
homing_speed: 100

[tmc2209 stepper_z]
uart_pin: PC11
tx_pin: PC10
uart_address: 1
run_current: 0.580
interpolate: False

# ---------------------

[stepper_y]
step_pin: PB10
dir_pin: PB2
enable_pin: !PB11
microsteps: 32
full_steps_per_rotation: 200
rotation_distance: 40
endstop_pin: ^PC1
position_endstop: 0
position_max: 213
homing_speed: 100
second_homing_speed: 50

[tmc2209 stepper_y]
uart_pin: PC11
tx_pin: PC10
uart_address: 2
run_current: 0.580
interpolate: False

# ---------------------

[extruder]
step_pin: PB3
dir_pin: !PB4
enable_pin: !PD1
microsteps: 32
#rotation_distance: 33.500 #<- este es anterior de ender3
rotation_distance: 4.637 # LDO-36STH20-1004AHG
max_extrude_only_distance: 500 # LDO-36STH20-1004AHG
max_extrude_only_velocity: 120 # LDO-36STH20-1004AHG
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PC8
sensor_pin: PA0
min_extrude_temp: 9
max_extrude_cross_section: 2
max_extrude_only_distance: 100
#pressure_advance LDO-36STH20-1004AHG
#pressure_advance:
#
#control: pid
#[cr10 ender sensor]
#sensor_type: EPCOS 100K B57560G104F
#min_temp: 0
#max_temp: 250
#pid_Kp: 21.527
#pid_Ki: 1.063
#pid_Kd: 108.982
#pressure_advance: 0.44
#---
#pid_Kp: 54.027
#pid_Ki: 0.770
#pid_Kd: 948.182
#---
# PREASSURE ADVANCE
# PLA acc 4000 = 0.4912
# PLA acc 500 = 1.006
# ABS acc 500 = 0.1075
# 12.83*0,020 https://www.klipper3d.org/Pressure_Advance.html#tuning-pressure-advance
