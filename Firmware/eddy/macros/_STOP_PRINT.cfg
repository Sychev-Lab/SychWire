#----
# prusa slicer replace ENG G-CODE
#
#STOP_PRINT
#
#----

[gcode_macro STOP_PRINT]
#rename_existing: STOP_PRINT
gcode:
  {% set axieMaxX = printer.toolhead.axis_maximum.x %}
  {% set axieMaxY = printer.toolhead.axis_maximum.y %}
  
  M117 "Stopping printing"

  M106 S0 ; Turn Fan Off
  M104 S0 ; turn off extruder
  M140 S0 ; turn off bed
    
  G91               # Set Relative Positioning
  G1 E-3 Z+10 F3000 # Move Z Up
  
  G90 ; absolute position
  G1 X{axieMaxX} Y{axieMaxY} F3000
  
  
  # Disable
  M104 S0
  M140 S0
  M106 S0
  M84
  
  BED_MESH_CLEAR
  
  M117 "JOB DONE"