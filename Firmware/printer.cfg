# This file contains common pin mappings for the BIGTREETECH SKR mini
# E3 v3.0. To use this config, the firmware should be compiled for the
# STM32G0B1 with a "8KiB bootloader" and USB communication.

# The "make flash" command does not work on the SKR mini E3. Instead,
# after running "make", copy the generated "out/klipper.bin" file to a
# file named "firmware.bin" on an SD card and then restart the SKR
# mini E3 with that SD card.

# See docs/Config_Reference.md for a description of parameters.

[include mainsail.cfg]
[include macros/*.cfg]

#[include host_display_menu.cfg]
#[host_ip]

#[include adxl345.cfg] # Comment this out when you disconnect the accelerometer
[include inputShaper.cfg] # Comment when use adxl345 accelerometer

#Legacy Adaptive Meshing
[include KAMP_Settings.cfg]
#[include Adaptive_Mesh_legacy.cfg]

[exclude_object]

[mcu]
serial: /dev/ttyAMA0
restart_method: command

[printer]
kinematics: corexz
max_velocity: 500
max_accel: 4000
max_z_velocity: 8 #100
max_z_accel: 120 #500 - velocidad de la Z
#square_corner_velocity: 4.0

#3dTouch with custom support
[bltouch]
sensor_pin: ^PC14
control_pin: PA1
pin_up_reports_not_triggered: True
probe_with_touch_mode: False
x_offset: -39
y_offset: -13
samples: 2 #2
samples_result: average
speed: 2
lift_speed: 20
#commnet z_offset after config
#z_offset: 0.0 

[safe_z_home]
home_xy_position: 124, 118 # center nozzle
speed: 75
z_hop: 11 #move up 10mm
z_hop_speed: 5

[bed_mesh]
speed: 120
horizontal_move_z: 6
mesh_min: 0, 0
#X 210, Y 210 -> hay que restar bl offser x = 210 - 39 | y = 210 - 13 
mesh_max: 169, 197
algorithm: bicubic
probe_count: 4, 4

[screws_tilt_adjust]
screw1: 60, 30
screw1_name: fl del. izq 1 
screw2: 230, 30
screw2_name: fr del. der 2
screw3: 230, 197
screw3_name: rr det. der 3
screw4: 60, 197
screw4_name: rl det. izq 4
horizontal_move_z: 10
speed: 250
screw_thread: CW-M3

# ------------

[stepper_x]
step_pin: PB13
dir_pin: PB12
enable_pin: !PB14
microsteps: 32
full_steps_per_rotation: 200
rotation_distance: 40
endstop_pin: ^PC0
position_min: 0
position_max: 232
position_endstop: 232
homing_speed: 100
homing_positive_dir: true

[tmc2209 stepper_x]
uart_pin: PC11
tx_pin: PC10
uart_address: 0
run_current: 0.580 # new - may need changing

[stepper_z]
step_pin: PB0
dir_pin: PC5
enable_pin: !PB1
microsteps: 32
full_steps_per_rotation: 200
rotation_distance: 40
endstop_pin: probe:z_virtual_endstop #^PC2
position_min: -6
position_max: 242
homing_speed: 100

[tmc2209 stepper_z]
uart_pin: PC11
tx_pin: PC10
uart_address: 1
run_current: 0.580
interpolate: False

# ------------

[stepper_y]
step_pin: PB10
dir_pin: PB2
enable_pin: !PB11
microsteps: 32
full_steps_per_rotation: 200
rotation_distance: 40
endstop_pin: ^PC1
position_endstop: 0
position_max: 213
homing_speed: 100
second_homing_speed: 50

[tmc2209 stepper_y]
uart_pin: PC11
tx_pin: PC10
uart_address: 2
run_current: 0.580
interpolate: False

# ------------

[extruder]
step_pin: PB3
dir_pin: !PB4
enable_pin: !PD1
microsteps: 32
rotation_distance: 33.500
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PC8
sensor_pin: PA0
min_extrude_temp: 9
max_extrude_cross_section: 2
max_extrude_only_distance: 100
#control: pid
#[cr10 ender sensor]
#sensor_type: EPCOS 100K B57560G104F
#min_temp: 0
#max_temp: 250
#pid_Kp: 21.527
#pid_Ki: 1.063
#pid_Kd: 108.982
#pressure_advance: 0.44
#---
#pid_Kp: 54.027
#pid_Ki: 0.770
#pid_Kd: 948.182
#---
# PREASSURE ADVANCE
# PLA acc 4000 = 0.4912
# PLA acc 500 = 1.006
# 12.83*0,020 https://www.klipper3d.org/Pressure_Advance.html#tuning-pressure-advance
#pressure_advance: 0.29509
#---
sensor_type: ATC Semitec 104GT-2
pullup_resistor: 4267
min_temp: -273.15
max_temp: 300

[tmc2209 extruder]
uart_pin: PC11
tx_pin: PC10
uart_address: 3
run_current: 0.650
stealthchop_threshold: 999999
interpolate: False

# ---------------------

[heater_bed]
heater_pin: PC9
sensor_type: ATC Semitec 104GT-2
sensor_pin: PC4
min_temp: 0
max_temp: 130

[controller_fan heatbreak_cooling_fan] #[heater_fan heatbreak_cooling_fan]
pin: PC7
max_power: 1.00 #-new
kick_start_time: 0.200 #-new
heater: heater_bed #-new

[heater_fan controller_fan]
pin: PB15
heater: extruder
heater_temp: 50.0

[fan]
cycle_time: .08
pin: PC6 # "FAN0"
kick_start_time: .25

[board_pins]
aliases:
	# EXP1 header
	EXP1_1=PB5,  EXP1_3=PA9,   EXP1_5=PA10, EXP1_7=PB8, EXP1_9=<GND>,
	EXP1_2=PA15, EXP1_4=<RST>, EXP1_6=PB9,  EXP1_8=PD6, EXP1_10=<5V>

# See the sample-lcd.cfg file for definitions of common LCD displays.

######################################################################
