#...
#
#START_PRINT EXTRUDER_TEMP=[first_layer_temperature] BED_TEMP=[first_layer_bed_temperature] FIRST_LAYER_MIN_X=[first_layer_print_min[0]] FIRST_LAYER_MIN_Y=[first_layer_print_min[1]] LAST_LAYER_MAX_X=[first_layer_print_max[0]] LAST_LAYER_MAX_Y=[first_layer_print_max[1]] ;adaptive calibration
#

#G90 ; use absolute coordinates
#M83 ; extruder relative mode
#M104 S150 ; set temporary nozzle temp to prevent oozing during homing
#M140 S{first_layer_bed_temperature[0]} ; set final bed temp
#G4 S30 ; allow partial nozzle warmup
#G28 ; home all axis
#
#M190 S0 ; Prevents prusaslicer from prepending m190 to the gcode ruining our macro
#M109 S0 ; Prevents prusaslicer from prepending m109 to the gcode ruining our macro
#
#
#BED_MESH_CALIBRATE AREA_START={first_layer_print_min[0]},{first_layer_print_min[1]} AREA_END={first_layer_print_max[0]},{first_layer_print_max[1]}
#START_PRINT EXTRUDER_TEMP=[first_layer_temperature] BED_TEMP=[first_layer_bed_temperature]
#
#G1 Z50 F240
#G1 X2.0 Y10 F3000
#M104 S{first_layer_temperature[0]} ; set final nozzle temp
#M190 S{first_layer_bed_temperature[0]} ; wait for bed temp to stabilize
#M109 S{first_layer_temperature[0]} ; wait for nozzle temp to stabilize
#G1 Z0.28 F240
#G92 E0
#G1 X2.0 Y140 E10 F1500 ; prime the nozzle
#G1 X2.3 Y140 F5000
#G92 E0
#G1 X2.3 Y10 E10 F1200 ; prime the nozzle
#G92 E0


[gcode_macro START_PRINT]
gcode:
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(190)|float %}

    # Use absolute coordinates
    #G90
    # Reset the G-Code Z offset (adjust Z offset if needed)
    SET_GCODE_OFFSET Z=0.0
    # Home the printer
    #G28

    #Load skew profile
    #SKEW_PROFILE LOAD=default

    BED_MESH_CALIBRATE
    
    #Load mesh profile
    #BED_MESH_PROFILE LOAD=default
    
    
    # Start bed heating
    M140 S{BED_TEMP}
  
    # Move the nozzle near the bed
    G1 Z5 F3000
    # Move the nozzle very close to the bed
    G1 Z0.15 F300
    # Wait for bed to reach temperature
    M190 S{BED_TEMP}
    # Set and wait for nozzle to reach temperature
    M109 S{EXTRUDER_TEMP}